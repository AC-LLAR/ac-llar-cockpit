<script>
function uiDialog(o){return new Promise(res=>{
  const msg=String(o.msg||'');const parts=msg.split(/\n\n/);
  const title=o.title||((parts.length>1||msg.length<80)?parts.shift():'');
  const ov=document.createElement('div');ov.className='dlg-ov';
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${title?'<h3></h3>':''}${parts.length?'<p></p>':''}${o.input!=null?'<input>':''}<div class="dlg-btns">${o.cancel===null?'':'<button class="dlg-cancel"></button>'}<button class="dlg-ok ${o.danger?'danger':''}"></button></div></div>`;
  if(title)ov.querySelector('h3').textContent=title;
  if(parts.length)ov.querySelector('p').textContent=parts.join('\n\n');
  const inp=ov.querySelector('input');if(inp)inp.value=o.input;
  const okB=ov.querySelector('.dlg-ok'),cB=ov.querySelector('.dlg-cancel');
  okB.textContent=o.ok||'Aceptar';if(cB)cB.textContent=o.cancel||'Cancelar';
  const done=v=>{ov.remove();document.removeEventListener('keydown',kd,true);res(v);};
  const kd=e=>{if(e.key==='Escape'){e.preventDefault();done(o.cancel===null?true:null);}else if(e.key==='Enter'){e.preventDefault();done(inp?inp.value:true);}};
  okB.onclick=e=>{e.stopPropagation();done(inp?inp.value:true);};
  if(cB)cB.onclick=e=>{e.stopPropagation();done(null);};
  ov.onclick=e=>{e.stopPropagation();if(e.target===ov&&o.cancel!==null)done(null);};
  document.addEventListener('keydown',kd,true);document.body.appendChild(ov);
  if(inp){inp.focus();inp.select();}
});}
window.uiConfirm=(msg,o={})=>uiDialog({msg,...o}).then(v=>v!==null);
window.uiPrompt=(msg,def='',o={})=>uiDialog({msg,input:def==null?'':String(def),...o});
window.uiAlert=(msg,o={})=>uiDialog({msg,cancel:null,...o});
</script>

<style>
#splash{position:fixed;inset:0;z-index:2000;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,visibility .45s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;transition:transform .45s ease}
#splash.out .sp-in{transform:scale(1.04)}
#splash img{width:min(64vw,260px);height:auto;opacity:0;transform:translateY(8px) scale(.96);animation:spIn .6s cubic-bezier(.2,.7,.2,1) .05s forwards}
#splash .sp-bar{width:min(40vw,150px);height:2px;background:#F1F2F4;border-radius:2px;margin-top:26px;overflow:hidden;opacity:0;animation:spFade .3s ease .35s forwards}
#splash .sp-bar i{display:block;height:100%;width:0;background:#E8640A;border-radius:2px;animation:spBar .8s cubic-bezier(.4,0,.2,1) .4s forwards}
#splash .sp-txt{margin-top:12px;font:600 11px/1 "Manrope",-apple-system,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9CA3AF;opacity:0;animation:spFade .4s ease .45s forwards}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<script>
(function(){var sp=document.getElementById('splash');if(!sp)return;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0=Date.now(),MIN=reduce?300:1250,gone=false;
  function hide(){if(gone)return;gone=true;sp.classList.add('out');setTimeout(function(){sp.remove();},500);}
  sp.addEventListener('click',hide);
  function ready(){setTimeout(hide,Math.max(0,MIN-(Date.now()-t0)));}
  if(document.readyState==='complete')ready();else window.addEventListener('load',ready);
  setTimeout(hide,3500);
})();
</script>

// INDEXEDDB HELPERS (base de datos local, sin sandbox)
// =====================================================================
const DB_NAME='ac_llar_db';
const DB_VERSION=1;
let dbInstance=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    if(dbInstance){resolve(dbInstance);return;}
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('inspections'))db.createObjectStore('inspections',{keyPath:'id'});
      if(!db.objectStoreNames.contains('cache'))db.createObjectStore('cache',{keyPath:'vehId'});
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess=(e)=>{dbInstance=e.target.result;resolve(dbInstance);};
    req.onerror=(e)=>reject(e.target.error);
  });
}

async function dbPut(store,item){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(item);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=(e)=>reject(e.target.error);
  });
}

async function dbGet(store,key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=(e)=>reject(e.target.error);
  });
}

async function dbGetAll(store){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=(e)=>reject(e.target.error);
  });
}

async function dbDelete(store,key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=(e)=>reject(e.target.error);
  });
}

function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className='toast '+(type==='err'?'err':type==='ok'?'ok':'');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function fmtDate(iso){
  if(!iso)return '';
  const d=new Date(iso);
  return d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function fmtDateShort(iso){
  if(!iso)return '';
  const d=new Date(iso);
  return d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function isToday(iso){
  if(!iso)return false;
  const d=new Date(iso);
  const t=new Date();
  return d.toDateString()===t.toDateString();
}

function fmtDur(startIso,endIso){
  if(!startIso||!endIso)return '';
  const ms=new Date(endIso)-new Date(startIso);
  if(ms<0||isNaN(ms))return '';
  const mins=Math.round(ms/60000);
  if(mins<1)return '<1 min';
  if(mins<60)return `${mins} min`;
  const h=Math.floor(mins/60);
  const m=mins%60;
  return m===0?`${h} h`:`${h} h ${m} min`;
}

function fmtTime(iso){
  if(!iso)return '';
  return new Date(iso).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}

// Comprimir imagen a 800px máx, calidad 0.7 - misma que el artefacto original
// Compresión de imagen. Daños: 1200px/0.8 (por defecto). Fotos generales: 2000px/0.85.
function compressImage(file,maxPx,quality){
  const MAX=maxPx||1200;
  const Q=quality||0.75;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(MAX/img.width,MAX/img.height,1);
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*sc);
        canvas.height=Math.round(img.height*sc);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',Q));
      };
      img.onerror=reject;
      img.src=ev.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// ── CÁMARA SIMPLE (un toque = una foto, cámara del sistema) ──────────────
// Reapertura automática no es posible con archivo local en Chrome Android
// (el navegador bloquea el .click() programático). Para varias fotos: Galería.
function takeCameraPhoto(targetArray,maxPx,quality){
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.capture='environment';
  input.style.display='none';
  document.body.appendChild(input);
  input.onchange=async(e)=>{
    const files=Array.from(e.target.files||[]);
    for(const file of files){
      try{const b64=await compressImage(file,maxPx,quality);targetArray.push(b64);}catch(err){}
    }
    try{input.remove();}catch(e){}
    render();
  };
  input.click();
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function downloadText(text,filename,mime){
  const blob=new Blob([text],{type:mime+';charset=utf-8'});
  downloadBlob(blob,filename);
}

async function loadRecord(r){
  state.currentInsp={
    id:r.id,
    date:r.date,
    startedAt:r.startedAt||r.date, // fallback a date para inspecciones viejas
    finishedAt:r.finishedAt||null,
    revNum:r.revNum,
    veh:{...r.veh},
    fuel:r.fuel,
    km:r.km!=null?r.km:null,
    notes:r.notes||'',
    ag:r.ag||{gr:null,ne:null},
    equip:r.equip||{},
    optInc:r.optInc||{},
    optRet:r.optRet||{},
    items:r.itemsSnapshot?JSON.parse(JSON.stringify(r.itemsSnapshot)):{},
    genPhotos:r.genPhotos||[],
  };
  // Si no hay itemsSnapshot, reconstruir desde dmgs
  if(!r.itemsSnapshot&&r.dmgs){
    r.dmgs.forEach(d=>{
      state.currentInsp.items[d.c]={s:'dmg',d:{ty:d.ty,gr:d.gr,rep:d.rep,pt:d.pt,fc:d.fc,photos:d.photos||[]}};
    });
  }
  state.editingId=r.id;
  state.itab='info';
  state.view='inspect';
  render();
}

async function backToHome(){
  if(state.currentInsp&&!state.editingId){
    if(!(await uiConfirm('¿Descartar esta inspección sin guardar?', {ok:'Descartar',danger:true})))return;
  }
  state.currentInsp=null;
  state.editingId=null;
  state.view='home';
  render();
}

// Guardar inspección
async function saveInspection(){
  const c=state.currentInsp;
  const items=c.items;
  const dmgList=Object.entries(items).filter(([,v])=>v?.s==='dmg');
  const missB=EQB.filter(e=>c.equip[e.id]==='miss');
  const missO=EQO.filter(e=>c.optInc[e.id]&&c.optRet[e.id]==='miss');
  const missAll=[...missB,...missO];
  const now=new Date().toISOString();
  const insp={
    id:c.id,
    date:c.date,
    startedAt:c.startedAt||c.date,
    finishedAt:c.finishedAt||now, // primera guarda: ahora; ediciones: mantener original
    editedAt:state.editingId?now:undefined,
    revNum:c.revNum,
    veh:c.veh,
    fuel:c.fuel,
    km:c.km!=null?c.km:null,
    notes:c.notes||'',
    ag:c.ag,
    equip:c.equip,
    optInc:c.optInc,
    optRet:c.optRet,
    genPhotos:c.genPhotos,
    itemsSnapshot:JSON.parse(JSON.stringify(items)),
    dmgs:dmgList.map(([code,v])=>({c:code,name:ALL.find(i=>i.code===code)?.name,...v.d})),
    miss:missAll.map(e=>e.name),
    stats:{
      tot:ALL.length,
      rev:Object.keys(items).length,
      ok:Object.values(items).filter(i=>i?.s==='ok').length,
      dmg:dmgList.length,
      na:Object.values(items).filter(i=>i?.s==='na').length,
      miss:missAll.length,
    },
  };
  try{
    await dbPut('inspections',insp);
    // Actualizar cache de daños SOLO si esta inspección es la más reciente para ese vehículo
    const existingCache=state.cache[insp.veh.id];
    const isNewerOrEqual=!existingCache||new Date(insp.date)>=new Date(existingCache.date);
    if(isNewerOrEqual){
      if(insp.dmgs&&insp.dmgs.length>0){
        const cacheEntry={
          vehId:insp.veh.id,
          date:insp.date,
          plate:insp.veh.plate,
          dmgs:insp.dmgs.map(d=>({code:d.c,name:d.name,d:{ty:d.ty,gr:d.gr,rep:d.rep,pt:d.pt,fc:d.fc,photos:d.photos||[]}})),
        };
        await dbPut('cache',cacheEntry);
        state.cache[insp.veh.id]=cacheEntry;
      }else{
        // Solo borrar cache si esta inspección sin daños es la más reciente
        await dbDelete('cache',insp.veh.id).catch(()=>{});
        delete state.cache[insp.veh.id];
      }
    }
    // Si estamos editando una inspección VIEJA (más antigua que la del cache),
    // el cache NO se toca — sigue reflejando la última revisión más reciente.
    // Recargar historial
    state.records=await dbGetAll('inspections');
    state.records.sort((a,b)=>new Date(b.date)-new Date(a.date));
    toast('Inspección guardada','ok');
    state.currentInsp=null;
    state.editingId=null;
    state.view='home';
    state.tab='history';
    render();
  }catch(e){
    toast('Error al guardar: '+(e.message||e),'err');
  }
}

async function deleteRecord(id){
  if(!(await uiConfirm('¿Borrar esta inspección? No se puede deshacer.', {ok:'Borrar',danger:true})))return;
  try{
    const rec=state.records.find(r=>r.id===id);
    await dbDelete('inspections',id);
    state.records=state.records.filter(r=>r.id!==id);
    // Si esta inspección estaba en cache, buscar la siguiente más reciente del mismo vehículo
    if(rec&&rec.veh&&state.cache[rec.veh.id]&&state.cache[rec.veh.id].date===rec.date){
      const others=state.records.filter(r=>r.veh?.id===rec.veh.id&&r.dmgs&&r.dmgs.length>0);
      others.sort((a,b)=>new Date(b.date)-new Date(a.date));
      if(others.length>0){
        const latest=others[0];
        const cacheEntry={
          vehId:latest.veh.id,
          date:latest.date,
          plate:latest.veh.plate,
          dmgs:latest.dmgs.map(d=>({code:d.c,name:d.name,d:{ty:d.ty,gr:d.gr,rep:d.rep,pt:d.pt,fc:d.fc,photos:d.photos||[]}})),
        };
        await dbPut('cache',cacheEntry);
        state.cache[latest.veh.id]=cacheEntry;
      }else{
        await dbDelete('cache',rec.veh.id).catch(()=>{});
        delete state.cache[rec.veh.id];
      }
    }
    toast('Borrada','ok');
    render();
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function downloadReport(r){
  try{
    let revNum;
    if(r.revNum){
      // Ya se descargó antes: usar el número sellado, no reasignar
      revNum=r.revNum;
    }else{
      // Primera descarga: asignar número basado en el máximo de descargas previas del mismo vehículo
      const sameVehSealed=state.records
        .filter(x=>x.veh?.id===r.veh?.id&&typeof x.revNum==='number');
      const maxSealed=sameVehSealed.length>0?Math.max(...sameVehSealed.map(x=>x.revNum)):0;
      const offset=state.revOffsets[r.veh?.id]||0;
      // Nueva revisión = 1 + max(offset, maxSealed)
      revNum=Math.max(offset,maxSealed)+1;
      // Sellar en la inspección para futuras descargas
      try{
        r.revNum=revNum;
        await dbPut('inspections',r);
        // Refrescar records
        const idx=state.records.findIndex(x=>x.id===r.id);
        if(idx>=0)state.records[idx]=r;
      }catch(e){/* si falla el sellado, igual seguimos con la descarga */}
    }
    const html=buildExportHTML(r,revNum);
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const fname=`OT · ${r.veh?.id||'SIN-ID'} · ${r.veh?.plate||''} (${revNum}).html`;
    downloadBlob(blob,fname);
    toast('Descargado como '+fname,'ok');
    render();
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function rescueAll(){
  try{
    const all=await dbGetAll('inspections');
    if(all.length===0){toast('No hay inspecciones para rescatar');return;}
    const ts=new Date().toISOString().slice(0,16).replace(/[T:]/g,'-');
    downloadText(JSON.stringify(all,null,2),`RESCATE_${ts}.json`,'application/json');
    toast('Rescate descargado','ok');
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function exportCache(){
  try{
    const all=await dbGetAll('cache');
    if(all.length===0){toast('Cache vacío');return;}
    const obj={};
    all.forEach(c=>{obj[c.vehId]={date:c.date,plate:c.plate,dmgs:c.dmgs};});
    const ts=new Date().toISOString().slice(0,10);
    downloadText(JSON.stringify(obj,null,2),`AC-LLAR_cache_${ts}.json`,'application/json');
    toast('Cache descargado','ok');
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function clearAllInspections(){
  const count=state.records.length;
  if(count===0){toast('No hay nada que borrar');return;}
  if(!(await uiConfirm(`¿Borrar TODAS las ${count} inspecciones del historial?\n\nSE VA A DESCARGAR UN BACKUP AUTOMÁTICO antes de borrar.\n\nEsto NO borra:\n• Cache de daños\n• Flota\n• Offsets de revisiones\n\nÚtil para arrancar con historial limpio y que la numeración empiece desde el offset de OneDrive.`, {ok:'Borrar',danger:true})))return;
  if(!(await uiConfirm(`Última confirmación: ¿borrar ${count} inspecciones? (Se descarga backup antes)`, {ok:'Borrar',danger:true})))return;
  try{
    // BACKUP AUTOMÁTICO antes de tocar nada
    try{
      const ts=new Date().toISOString().slice(0,16).replace(/[T:]/g,'-');
      downloadText(JSON.stringify(state.records,null,2),`BACKUP_ANTES_DE_BORRAR_${ts}.json`,'application/json');
    }catch(e){
      await uiAlert('No se pudo descargar el backup. Se aborta el borrado. Detalle: '+(e.message||e));
      return;
    }
    // Recién ahora borro (SOLO el store 'inspections')
    const db=await openDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction('inspections','readwrite');
      tx.objectStore('inspections').clear();
      tx.oncomplete=()=>resolve(true);
      tx.onerror=(e)=>reject(e.target.error);
    });

  }catch(e){

}

async function editSingleOffset(){
  const raw=(await uiPrompt('¿Qué vehículo? (ej: AC-271)'));
  if(!raw)return;
  // Normalizar entrada: mayúsculas + trim
  const vehId=raw.trim().toUpperCase();
  // Buscar case-insensitive en las keys existentes
  const existingKey=Object.keys(state.revOffsets).find(k=>k.toUpperCase()===vehId);
  const current=existingKey?state.revOffsets[existingKey]:0;
  const nuevo=(await uiPrompt(`Offset actual de ${vehId}: ${current}\n\n¿Nuevo valor? (número máximo (N) que existe en OneDrive)\n\nEjemplo: si el archivo más alto en OneDrive es (5), poné 5.`,current));
  if(nuevo===null)return;
  const n=parseInt(nuevo,10);
  if(isNaN(n)||n<0){toast('Debe ser un número >= 0','err');return;}
  try{
    const newOffsets={...state.revOffsets};
    // Si existía con otra capitalización, borrar el viejo para no dejar duplicados
    if(existingKey&&existingKey!==vehId)delete newOffsets[existingKey];
    newOffsets[vehId]=n;
    await dbPut('meta',{key:'revOffsets',value:newOffsets});
    state.revOffsets=newOffsets;
    toast(`${vehId} → offset ${n}`,'ok');
    render();
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function importFleetFile(file){
  try{
    const ext=file.name.split('.').pop().toLowerCase();
    let rows=[];
    if(ext==='csv'){
      const text=await file.text();
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){toast('CSV vacío','err');return;}
      const headers=lines[0].split(/[,;]/).map(h=>h.trim().replace(/^"|"$/g,''));
      for(let i=1;i<lines.length;i++){
        const cells=lines[i].split(/[,;]/).map(c=>c.trim().replace(/^"|"$/g,''));
        const row={};
        headers.forEach((h,j)=>row[h]=cells[j]||'');
        rows.push(row);
      }
    }else{
      if(typeof XLSX==='undefined'){
        toast('Necesitás internet para importar Excel la primera vez (SheetJS). Guardá como CSV o conectate.','err');
        return;
      }
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    }
    if(rows.length===0){toast('Sin filas para importar','err');return;}
    // Detección de columnas (insensible a acentos/mayúsculas, busca substring)
    const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s_-]/g,'').trim();
    const KW={
      id:['identificador','codigo','code'],
      plate:['matricula','placa','plate'],
      vin:['vin','chasis'],
      brand:['marca','brand'],
      model:['modelo','model'],
      sede:['ubicacion','sede','base','localidad','delegacion'],
    };
    const headers=Object.keys(rows[0]);
    const normHeaders=headers.map(h=>({orig:h,norm:norm(h)}));
    const keyMap={};
    Object.entries(KW).forEach(([field,keywords])=>{
      for(const kw of keywords){
        const match=normHeaders.find(h=>h.norm.includes(kw));
        if(match){keyMap[field]=match.orig;break;}
      }
    });
    if(!keyMap.id||!keyMap.plate){
      toast('El archivo necesita columnas "ID" y "Matrícula" al menos','err');
      return;
    }
    const newFleet=[];
    let errored=0;
    rows.forEach(row=>{
      const id=String(row[keyMap.id]||'').trim();
      const plate=String(row[keyMap.plate]||'').trim();
      if(!id||!plate){errored++;return;}
      newFleet.push({
        id,plate,
        vin:keyMap.vin?String(row[keyMap.vin]||'').trim():'',
        brand:keyMap.brand?String(row[keyMap.brand]||'').trim():'',
        model:keyMap.model?String(row[keyMap.model]||'').trim():'',
        sede:keyMap.sede?String(row[keyMap.sede]||'').trim():'',
      });
    });
    if(newFleet.length===0){toast('No se pudo leer ningún vehículo','err');return;}
    state.fleet=newFleet;
    await dbPut('meta',{key:'fleet',value:newFleet});
    toast(`${newFleet.length} vehículos cargados${errored>0?` (${errored} omitidos)`:''}`,'ok');
    render();
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function importCache(file){
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    if(!parsed||typeof parsed!=='object'){toast('Formato inválido','err');return;}
    let added=0,replaced=0,skipped=0;
    for(const vehId of Object.keys(parsed)){
      const entry=parsed[vehId];
      if(!entry||!Array.isArray(entry.dmgs)||!entry.date)continue;
      const existing=state.cache[vehId];
      if(existing){
        // Solo reemplazar si el import es más reciente o igual
        if(new Date(entry.date)>=new Date(existing.date)){
          await dbPut('cache',{vehId:vehId,date:entry.date,plate:entry.plate,dmgs:entry.dmgs});
          state.cache[vehId]={vehId:vehId,date:entry.date,plate:entry.plate,dmgs:entry.dmgs};
          replaced++;
        }else{
          skipped++;
        }
      }else{
        await dbPut('cache',{vehId:vehId,date:entry.date,plate:entry.plate,dmgs:entry.dmgs});
        state.cache[vehId]={vehId:vehId,date:entry.date,plate:entry.plate,dmgs:entry.dmgs};
        added++;
      }
    }
    const msg=`${added} agregados, ${replaced} actualizados${skipped>0?`, ${skipped} ignorados (más viejos que los existentes)`:''}`;
    toast(msg,'ok');
    render();
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

async function importInspections(file){
  try{
    const text=await file.text();
    let arr=JSON.parse(text);
    if(!Array.isArray(arr)){
      if(arr&&arr.id&&arr.veh)arr=[arr];
      else{toast('Formato inválido','err');return;}
    }
    let count=0;
    for(const r of arr){
      if(!r.id)continue;
      await dbPut('inspections',r);
      count++;
    }
    state.records=await dbGetAll('inspections');
    state.records.sort((a,b)=>new Date(b.date)-new Date(a.date));
    toast(`${count} inspecciones importadas`,'ok');
    render();
  }catch(e){
    toast('Error: '+(e.message||e),'err');
  }
}

function renderFleet(){

      const m=v.id.match(/^AC-(\d+)/);
      if(m){const n=parseInt(m[1],10);return n>=267&&n<=326?[0,n]:[1,n];}
      return [2,0];

function scrollToNextItem(currentCode){
  // Esperar un tick para que el DOM se re-renderice
  requestAnimationFrame(()=>{
    const cards=Array.from(document.querySelectorAll('[data-item-code]'));
    const idx=cards.findIndex(el=>el.dataset.itemCode===currentCode);
    if(idx<0||idx>=cards.length-1)return;
    // Buscar el próximo ítem que aún NO tenga estado marcado
    const items=state.itab==='ext'?EXT:state.itab==='int'?INT:[];
    let nextEl=null;
    for(let i=idx+1;i<cards.length;i++){
      const code=cards[i].dataset.itemCode;
      const st=state.currentInsp.items[code];
      if(!st){nextEl=cards[i];break;}
    }
    // Si todos los siguientes están marcados, ir al inmediatamente siguiente (que exista)
    if(!nextEl)nextEl=cards[idx+1]||null;
    if(nextEl){
      nextEl.scrollIntoView({behavior:'smooth',block:'center'});
    }
  });
}

function openCopyDmgModal(){
  const c=state.currentInsp;
  const cached=state.cache[c.veh.id];
  if(!cached)return;
  const sel={};
  cached.dmgs.forEach(x=>{sel[x.code]=!c.items[x.code];});
  state.copySel=sel;
  state.showCopyDmg=true;
  render();
}

function applyCopiedDmgs(){
  const c=state.currentInsp;
  const cached=state.cache[c.veh.id];
  if(!cached)return;
  const sel=cached.dmgs.filter(x=>state.copySel[x.code]);
  sel.forEach(x=>{
    c.items[x.code]={s:'dmg',d:JSON.parse(JSON.stringify(x.d))};
  });
  state.showCopyDmg=false;
  state.copySel={};
  toast(`${sel.length} daño${sel.length!==1?'s':''} copiado${sel.length!==1?'s':''}`,'ok');
  render();
}

  const pending=cached.dmgs.filter(x=>codesInList.has(x.code)&&!c.items[x.code]);

  return `<div class="cached-banner" data-open-copy-dmg>

}

function attachHandlers(){
  // Toggle tabs home
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick=()=>{state.tab=el.dataset.tab;render();};
  });
  // Search input
  const s=document.getElementById('search');
  if(s)s.oninput=e=>{
    state.search=e.target.value;
    render();
    const el=document.getElementById('search');
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
  };
  // Chips sede
  document.querySelectorAll('[data-sede]').forEach(el=>{
    el.onclick=()=>{state.sedeF=el.dataset.sede;render();};
  });
  // Card vehículo → nueva inspección
  document.querySelectorAll('[data-veh-id]').forEach(el=>{
    el.onclick=()=>{
      const v=state.fleet.find(f=>f.id===el.dataset.vehId);
      if(v)newInspection(v);
    };
  });
  // Acciones home/settings
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick=async(e)=>{
      e.stopPropagation();
      const a=el.dataset.action;
      const id=el.dataset.id?parseInt(el.dataset.id,10):null;
      if(a==='rescue')rescueAll();
      else if(a==='settings'){state.view='settings';render();}
      else if(a==='back-home'){state.view='home';render();}
      else if(a==='back-inspect')backToHome();
      else if(a==='save-inspection')saveInspection();
      else if(a==='download'&&id!==null){const r=state.records.find(x=>x.id===id);if(r)downloadReport(r);}
      else if(a==='edit'&&id!==null){const r=state.records.find(x=>x.id===id);if(r)loadRecord(r);}
      else if(a==='delete'&&id!==null)deleteRecord(id);
      else if(a==='export-cache')exportCache();
      else if(a==='reset-fleet')resetFleet();
      else if(a==='reset-offsets')resetRevOffsets();
      else if(a==='edit-single-offset')editSingleOffset();
      else if(a==='clear-inspections')clearAllInspections();
    };
  });
  // Import flota (Excel/CSV)
  const impFleet=document.getElementById('import-fleet-file');
  if(impFleet)impFleet.onchange=async(e)=>{
    const f=e.target.files?.[0];
    if(f){await importFleetFile(f);e.target.value='';}
  };
  // Import offsets JSON
  const impOff=document.getElementById('import-offsets-file');
  if(impOff)impOff.onchange=async(e)=>{
    const f=e.target.files?.[0];
    if(f){await importRevOffsets(f);e.target.value='';}
  };
  // Dar de baja / reactivar vehículos
  document.querySelectorAll('[data-baja]').forEach(el=>{
    el.onclick=()=>darDeBaja(el.dataset.baja);
  });
  document.querySelectorAll('[data-reactivar]').forEach(el=>{
    el.onclick=()=>reactivar(el.dataset.reactivar);
  });
  const bajaSearch=document.getElementById('baja-search');
  if(bajaSearch)bajaSearch.oninput=e=>{
    state.bajaSearch=e.target.value;
    render();
    const el=document.getElementById('baja-search');
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
  };
  // Filtro y búsqueda historial
  document.querySelectorAll('[data-hist-filter]').forEach(el=>{
    el.onclick=()=>{state.histFilter=el.dataset.histFilter;render();};
  });
  const hs=document.getElementById('hist-search');
  if(hs)hs.oninput=e=>{
    state.histSearch=e.target.value;
    render();
    const el=document.getElementById('hist-search');
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
  };
  // Insp tabs
  document.querySelectorAll('[data-itab]').forEach(el=>{
    el.onclick=()=>{state.itab=el.dataset.itab;render();};
  });
  // Fuel
  document.querySelectorAll('[data-fuel]').forEach(el=>{
    el.onclick=()=>{state.currentInsp.fuel=el.dataset.fuel;render();};
  });
  // Kilómetros (no re-render en cada tecla para no perder foco)
  const kmInput=document.getElementById('km-input');
  if(kmInput)kmInput.oninput=e=>{
    const v=e.target.value.trim();
    state.currentInsp.km=v===''?null:parseInt(v,10);
  };
  // Notas (no re-render para no perder foco)
  const notesInput=document.getElementById('notes-input');
  if(notesInput)notesInput.oninput=e=>{
    state.currentInsp.notes=e.target.value;
  };
  // Aguas
  document.querySelectorAll('[data-ag]').forEach(el=>{
    el.onclick=()=>{state.currentInsp.ag[el.dataset.ag]=el.dataset.val;render();};
  });
  // Equip
  document.querySelectorAll('[data-equip]').forEach(el=>{
    el.onclick=()=>{state.currentInsp.equip[el.dataset.equip]=el.dataset.val;render();};
  });
  // Opt inc
  document.querySelectorAll('[data-opt-inc]').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.optInc;
      state.currentInsp.optInc[id]=el.dataset.val==='yes';
      if(el.dataset.val==='no')delete state.currentInsp.optRet[id];
      render();
    };
  });
  // Opt ret
  document.querySelectorAll('[data-opt-ret]').forEach(el=>{
    el.onclick=()=>{state.currentInsp.optRet[el.dataset.optRet]=el.dataset.val;render();};
  });
  // Items (Ext / Int)
  document.querySelectorAll('[data-item]').forEach(el=>{
    el.onclick=()=>{
      const code=el.dataset.item;
      const val=el.dataset.val;
      if(val==='dmg')openDamageModal(code);
      else{
        state.currentInsp.items[code]={s:val,d:null};
        render();
        // Scroll automático al siguiente ítem centrado
        scrollToNextItem(code);
      }
    };
  });
  // Editar daño existente
  document.querySelectorAll('[data-item-edit]').forEach(el=>{
    el.onclick=()=>{
      const code=el.dataset.itemEdit;
      const st=state.currentInsp.items[code];
      if(st&&st.s==='dmg'&&st.d)openDamageModal(code,st.d);
    };
  });
  // Banner sugeridor: abrir modal
  const banner=document.querySelector('[data-open-copy-dmg]');
  if(banner)banner.onclick=()=>openCopyDmgModal();
  // Modal sugeridor
  document.querySelectorAll('[data-copy-toggle]').forEach(el=>{
    el.onclick=()=>{
      const code=el.dataset.copyToggle;
      state.copySel[code]=!state.copySel[code];
      render();
    };
  });
  const copyClose=document.querySelector('[data-copy-close]');
  if(copyClose)copyClose.onclick=(e)=>{if(e.target===copyClose){state.showCopyDmg=false;state.copySel={};render();}};
  const copyStop=document.querySelector('[data-copy-stop]');
  if(copyStop)copyStop.onclick=(e)=>e.stopPropagation();
  const copyCancel=document.querySelector('[data-copy-cancel]');
  if(copyCancel)copyCancel.onclick=()=>{state.showCopyDmg=false;state.copySel={};render();};
  const copyApply=document.querySelector('[data-copy-apply]');
  if(copyApply)copyApply.onclick=()=>applyCopiedDmgs();
  // Modal daño
  document.querySelectorAll('[data-dmg-ty]').forEach(el=>{el.onclick=()=>{dmgFormState.ty=el.dataset.dmgTy;render();};});
  document.querySelectorAll('[data-dmg-gr]').forEach(el=>{el.onclick=()=>{dmgFormState.gr=el.dataset.dmgGr;render();};});
  document.querySelectorAll('[data-dmg-rep]').forEach(el=>{el.onclick=()=>{dmgFormState.rep=el.dataset.dmgRep;render();};});
  document.querySelectorAll('[data-dmg-pt]').forEach(el=>{el.onclick=()=>{dmgFormState.pt=el.dataset.dmgPt;render();};});
  const dmgClose=document.querySelector('[data-modal-close]');
  if(dmgClose)dmgClose.onclick=(e)=>{if(e.target===dmgClose){state.dmgModal=null;render();}};
  const dmgStop=document.querySelector('[data-modal-stop]');
  if(dmgStop)dmgStop.onclick=(e)=>e.stopPropagation();
  const dmgCancel=document.querySelector('[data-modal-cancel]');
  if(dmgCancel)dmgCancel.onclick=()=>{state.dmgModal=null;render();};
  const dmgSave=document.querySelector('[data-modal-save]');
  if(dmgSave)dmgSave.onclick=()=>saveDamage();
  // Fotos daño input (cámara y galería). maxPx/quality opcionales.
  const setupPhotoInput=(id,target,maxPx,quality)=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.onchange=async(e)=>{
      const files=Array.from(e.target.files||[]);
      for(const f of files){
        try{const b64=await compressImage(f,maxPx,quality);target.push(b64);}catch{}
      }
      e.target.value='';
      render();
    };
  };
  // Daños: calidad estándar (1200/0.8)
  setupPhotoInput('dmg-photo-gal',dmgFormState.photos);
  const dmgCamBtn=document.getElementById('dmg-cam-btn');
  if(dmgCamBtn)dmgCamBtn.onclick=()=>takeCameraPhoto(dmgFormState.photos);
  document.querySelectorAll('[data-dmg-photo-del]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();dmgFormState.photos.splice(parseInt(el.dataset.dmgPhotoDel,10),1);render();};
  });
  // Fotos generales: alta calidad (2000/0.85) para ver detalle estético
  if(state.currentInsp){
    setupPhotoInput('gen-photos-gal',state.currentInsp.genPhotos,1600,0.75);
    const genCamBtn=document.getElementById('gen-cam-btn');
    if(genCamBtn)genCamBtn.onclick=()=>takeCameraPhoto(state.currentInsp.genPhotos,1600,0.75);
  }
  document.querySelectorAll('[data-gen-photo-del]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();state.currentInsp.genPhotos.splice(parseInt(el.dataset.genPhotoDel,10),1);render();};
  });
  // Import cache file
  const impCache=document.getElementById('import-cache-file');
  if(impCache)impCache.onchange=async(e)=>{
    const f=e.target.files?.[0];
    if(f){await importCache(f);e.target.value='';}
  };
  const impInsp=document.getElementById('import-insp-file');
  if(impInsp)impInsp.onchange=async(e)=>{
    const f=e.target.files?.[0];
    if(f){await importInspections(f);e.target.value='';}
  };
}

// =====================================================================
// INIT
// =====================================================================
async function init(){
  document.getElementById('app').innerHTML='<div class="empty" style="padding-top:60px"><div class="spinner"></div><div class="empty-title" style="margin-top:14px">Cargando...</div></div>';
  try{
    await openDB();
    // Cargar flota persistida si existe
    try{
      const meta=await dbGet('meta','fleet');
      if(meta&&Array.isArray(meta.value)&&meta.value.length>0)state.fleet=meta.value;
    }catch{}
    // Cargar offsets de revisiones persistidos
    try{
      const meta=await dbGet('meta','revOffsets');
      if(meta&&meta.value&&typeof meta.value==='object')state.revOffsets=meta.value;
    }catch{}
    // Cargar bajas de flota persistidas
    try{
      const meta=await dbGet('meta','bajas');
      if(meta&&meta.value&&typeof meta.value==='object')state.bajas=meta.value;
    }catch{}
    state.records=await dbGetAll('inspections');
    state.records.sort((a,b)=>new Date(b.date)-new Date(a.date));
    const cacheArr=await dbGetAll('cache');
    state.cache={};
    cacheArr.forEach(c=>{state.cache[c.vehId]=c;});
    render();
  }catch(e){
    document.getElementById('app').innerHTML=`<div style="padding:20px;color:#DC2626">Error inicial: ${e.message||e}</div>`;
  }
}

// init() lo lanza nube-rev.js
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
