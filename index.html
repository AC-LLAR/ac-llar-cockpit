<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit AC-LLAR</title>
<link rel="preload" as="image" href="logo-acllar.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0F1720">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F7FB; }
  #root { min-height: 100vh; }
  #loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; color: #3B5BFF; font-family: sans-serif; }
  #loading .spin { width: 40px; height: 40px; border: 3px solid #E4E9F1; border-top-color: #3B5BFF; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #nube-login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F5F7FB; z-index: 9999; font-family: 'Manrope', sans-serif; }
  #nube-login form { background: #fff; border: 1px solid #E4E9F1; border-radius: 14px; padding: 28px; width: min(360px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 30px rgba(20,30,60,.08); }
  #nube-login .nl-title { font-size: 20px; font-weight: 800; color: #1B2333; }
  #nube-login .nl-sub { font-size: 13px; color: #6B7488; margin-top: -8px; }
  #nube-login label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A4256; }
  #nube-login input { padding: 10px 12px; border: 1px solid #D5DCE8; border-radius: 8px; font-size: 15px; font-family: inherit; }
  #nube-login button { padding: 11px; background: #3B5BFF; color: #fff; border: 0; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  #nube-login button:disabled { opacity: .6; }
  #nube-login .nl-err { color: #B42318; font-size: 13px; min-height: 16px; }
  #nube-badge { position: fixed; right: 12px; bottom: 12px; z-index: 9000; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 999px; font: 600 12px 'Manrope', sans-serif; background: #fff; border: 1px solid #E4E9F1; color: #3A4256; box-shadow: 0 2px 10px rgba(20,30,60,.08); }
  #nube-badge.nube-ok span { color: #067647; }
  #nube-badge.nube-busy span { color: #B54708; }
  #nube-badge.nube-err { background: #FEF3F2; border-color: #FDA29B; } #nube-badge.nube-err span { color: #B42318; }
  #nube-badge button { border: 1px solid #E4E9F1; background: #F5F7FB; border-radius: 999px; padding: 3px 10px; font: 600 11px 'Manrope', sans-serif; cursor: pointer; color: #3A4256; }
  #err { display: none; padding: 30px; max-width: 640px; margin: 40px auto; background: #FEE2E2; border: 1px solid #DC2626; border-radius: 10px; color: #7C2D12; font-family: sans-serif; line-height: 1.6; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-in"><img id="sp-logo" src="logo-acllar.png" alt=""><div class="sp-bar"><i></i></div><div class="sp-txt">Cockpit · Gestión de flota</div></div>
</div>
<script>try{if(localStorage.getItem("acllar_theme")==="dark"){document.getElementById("splash").classList.add("dark");document.getElementById("sp-logo").src="logo-acllar-dark.png";}}catch(e){}</script>
<style>
#splash{position:fixed;inset:0;z-index:2147483000;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,visibility .45s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;transition:transform .45s ease}
#splash.out .sp-in{transform:scale(1.04)}
#splash img{width:min(64vw,260px);height:auto;opacity:0;transform:translateY(8px) scale(.96);animation:spIn .6s cubic-bezier(.2,.7,.2,1) .05s forwards}
#splash .sp-bar{width:min(40vw,150px);height:2px;background:#F1F2F4;border-radius:2px;margin-top:26px;overflow:hidden;opacity:0;animation:spFade .3s ease .35s forwards}
#splash .sp-bar i{display:block;height:100%;width:0;background:#E8640A;border-radius:2px;animation:spBar .8s cubic-bezier(.4,0,.2,1) .4s forwards}
#splash .sp-txt{margin-top:12px;font:600 11px/1 "Manrope",-apple-system,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#9CA3AF;opacity:0;animation:spFade .4s ease .45s forwards}
#splash.dark{background:#0E1420}
#splash.dark .sp-bar{background:#28344A}
#splash.dark .sp-txt{color:#64748B}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<script>
(function(){var sp=document.getElementById('splash');if(!sp)return;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0=Date.now(),MIN=reduce?300:1250,gone=false;
  function hide(){if(gone)return;gone=true;sp.classList.add('out');setTimeout(function(){sp.remove();},500);}
  sp.addEventListener('click',hide);
  function ready(){setTimeout(hide,Math.max(0,MIN-(Date.now()-t0)));}
  if(document.readyState==='complete')ready();else window.addEventListener('load',ready);
  setTimeout(hide,8000);
})();
</script>
<div id="root"><div id="loading"><div class="spin"></div><div>Cargando cockpit…</div></div></div>
<div id="err"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="revision/ot-html.js?v=1"></script>
<script src="nube.js?v=14"></script>
<script src="motor.js?v=47"></script>
</body>
</html>
